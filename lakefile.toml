name = "Colean"
version = "0.1.0"
defaultTargets = ["Colean", "ColeanTest"]

[[lean_lib]]
name = "Colean"

[[lean_lib]]
name = "ColeanTest"

# Hand-written experiments, not part of the default build: `lake build Sketch`.
[[lean_lib]]
name = "Sketch"
globs = ["Sketch.+"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.34.1"
